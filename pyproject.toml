[project]
name = "support-agent"
version = "1.1.0"
description = "Customer support agent: RAG over an FAQ plus tool calling with Claude"
requires-python = ">=3.11,<3.15"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# load_dotenv() must run before importing modules that read environment variables.
"app/main.py" = ["E402"]
"frontend/streamlit_app.py" = ["E402"]
